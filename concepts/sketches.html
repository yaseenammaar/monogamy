<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mori Concepts</title>
<style>
  :root { --bg: #f4f2f7; --card: #fff; --ink: #1e1830; --muted: #8a839c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141118; --card: #1f1a28; --ink: #f1eef7; --muted: #8f88a3; } }
  body { margin: 0; padding: 32px 16px; background: var(--bg); color: var(--ink);
         font: 13px/1.4 -apple-system, system-ui, sans-serif; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 auto 20px; max-width: 760px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; max-width: 760px; margin: 0 auto; }
  figure { margin: 0; background: var(--card); border-radius: 14px; padding: 18px 12px 12px; text-align: center; }
  svg { width: 140px; height: 150px; }
  .small { display: flex; justify-content: center; gap: 10px; margin-top: 6px; }
  .small svg { width: 40px; height: 43px; }
  figcaption { font-weight: 600; margin-top: 8px; }
  figcaption span { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
</style>
</head>
<body>
<h1>Mori: four minimal directions (large and tiny)</h1>
<div class="grid">

  <figure>
    <svg viewBox="0 0 120 130" id="a">
      <ellipse cx="60" cy="122" rx="24" ry="3.5" fill="#000" opacity=".12"/>
      <ellipse cx="60" cy="20" rx="13" ry="3.4" fill="none" stroke="#e6c26a" stroke-width="2.4"/>
      <ellipse cx="22" cy="68" rx="13" ry="8" fill="#d3cce6" transform="rotate(-25 22 68)"/>
      <ellipse cx="98" cy="68" rx="13" ry="8" fill="#d3cce6" transform="rotate(25 98 68)"/>
      <line x1="100" y1="44" x2="100" y2="108" stroke="#8d84a6" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M100,44 Q111,40 116,50 Q108,46 100,49 Z" fill="#c9c1dd"/>
      <circle cx="60" cy="74" r="38" fill="#4a3d73"/>
      <path d="M54,38 Q60,28 66,38 Z" fill="#4a3d73"/>
      <circle cx="60" cy="68" r="21" fill="#2c2445"/>
      <circle cx="60" cy="70" r="17" fill="#f6f1ea"/>
      <circle cx="54" cy="69" r="2.4" fill="#1e1830"/><circle cx="66" cy="69" r="2.4" fill="#1e1830"/>
      <path d="M58,75 Q60,76.6 62,75" stroke="#1e1830" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="small"><svg viewBox="0 0 120 130"><use href="#a-src"/></svg></div>
    <figcaption>A · Blob<span>Round and soft, the friendliest</span></figcaption>
  </figure>

  <figure>
    <svg viewBox="0 0 120 130" id="b">
      <ellipse cx="60" cy="124" rx="16" ry="3" fill="#000" opacity=".12"/>
      <ellipse cx="60" cy="10" rx="11" ry="3" fill="none" stroke="#e6c26a" stroke-width="2.2"/>
      <path d="M44,44 C34,30 22,30 18,40 C26,40 34,46 42,58 Z" fill="#d3cce6"/>
      <path d="M76,44 C86,30 98,30 102,40 C94,40 86,46 78,58 Z" fill="#d3cce6"/>
      <line x1="88" y1="22" x2="88" y2="116" stroke="#8d84a6" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M88,22 Q100,18 105,30 Q96,25 88,28 Z" fill="#c9c1dd"/>
      <path d="M60,18 C47,18 42,30 42,44 L42,108 Q48,116 54,108 Q60,116 66,108 Q72,116 78,108 L78,44 C78,30 73,18 60,18 Z" fill="#4a3d73"/>
      <ellipse cx="60" cy="40" rx="13" ry="13" fill="#2c2445"/>
      <ellipse cx="60" cy="42" rx="10.5" ry="10" fill="#f6f1ea"/>
      <circle cx="56" cy="41.5" r="1.9" fill="#1e1830"/><circle cx="64" cy="41.5" r="1.9" fill="#1e1830"/>
      <path d="M58.6,46 Q60,47.2 61.4,46" stroke="#1e1830" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="small"><svg viewBox="0 0 120 130"><use href="#b-src"/></svg></div>
    <figcaption>B · Tall ghost<span>Elegant and a bit more serious</span></figcaption>
  </figure>

  <figure>
    <svg viewBox="0 0 120 130" id="c">
      <ellipse cx="60" cy="122" rx="20" ry="3.5" fill="#000" opacity=".12"/>
      <ellipse cx="60" cy="12" rx="15" ry="3.8" fill="none" stroke="#e6c26a" stroke-width="2.4"/>
      <path d="M40,88 C28,80 18,84 16,92 C24,92 30,96 38,102 Z" fill="#d3cce6"/>
      <path d="M80,88 C92,80 102,84 104,92 C96,92 90,96 82,102 Z" fill="#d3cce6"/>
      <path d="M44,84 L38,114 Q49,120 60,114 Q71,120 82,114 L76,84 Z" fill="#4a3d73"/>
      <line x1="90" y1="70" x2="86" y2="118" stroke="#8d84a6" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M90,70 Q101,66 106,77 Q98,72 90,75 Z" fill="#c9c1dd"/>
      <circle cx="60" cy="54" r="34" fill="#4a3d73"/>
      <circle cx="60" cy="57" r="26" fill="#2c2445"/>
      <circle cx="60" cy="59" r="22" fill="#f6f1ea"/>
      <circle cx="52" cy="58" r="3" fill="#1e1830"/><circle cx="68" cy="58" r="3" fill="#1e1830"/>
      <path d="M57.5,66 Q60,68 62.5,66" stroke="#1e1830" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="small"><svg viewBox="0 0 120 130"><use href="#c-src"/></svg></div>
    <figcaption>C · Chibi<span>Huge face, most expressive moods</span></figcaption>
  </figure>

  <figure>
    <svg viewBox="0 0 120 130" id="d">
      <ellipse cx="60" cy="122" rx="22" ry="3.5" fill="#000" opacity=".12"/>
      <ellipse cx="54" cy="18" rx="13" ry="3.4" fill="none" stroke="#e6c26a" stroke-width="2.4" transform="rotate(-10 54 18)"/>
      <path d="M32,64 C20,56 10,60 8,68 C16,68 22,72 30,78 Z" fill="#d3cce6"/>
      <path d="M90,60 C102,52 112,56 114,64 C106,64 100,68 92,74 Z" fill="#d3cce6"/>
      <line x1="98" y1="40" x2="96" y2="112" stroke="#8d84a6" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M98,40 Q109,36 114,47 Q106,42 98,45 Z" fill="#c9c1dd"/>
      <path d="M56,30 C34,30 28,52 30,74 C32,98 46,112 64,110 C84,108 92,92 90,74 C88,62 82,58 82,48 C82,36 72,30 56,30 Z" fill="#4a3d73"/>
      <ellipse cx="58" cy="62" rx="20" ry="18" fill="#2c2445"/>
      <ellipse cx="58" cy="64" rx="16.5" ry="15" fill="#f6f1ea"/>
      <circle cx="52" cy="63" r="2.4" fill="#1e1830"/><circle cx="64" cy="63" r="2.4" fill="#1e1830"/>
      <path d="M56,69 Q58,70.6 60,69" stroke="#1e1830" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="small"><svg viewBox="0 0 120 130"><use href="#d-src"/></svg></div>
    <figcaption>D · Bean<span>Quirky, slightly tilted</span></figcaption>
  </figure>

</div>
<script>
  // Mirror each big drawing into its small "actual size" preview.
  for (const id of ['a', 'b', 'c', 'd']) {
    const big = document.getElementById(id);
    const small = big.parentElement.querySelector('.small svg');
    small.innerHTML = big.innerHTML;
  }
</script>
</body>
</html>
